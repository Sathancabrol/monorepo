<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Sathancabrol — Monorepo{% endblock %}</title>
<style>
:root{--bg:#0b0c0f;--panel:#111318;--muted:#9aa0a6;--line:#23262d;--accent:#7c5cff;--accent2:#2dd4bf;--text:#e8eaed}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif}
a{color:var(--accent2);text-decoration:none}a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:20;background:rgba(11,12,15,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px}
header .brand{font-weight:700;letter-spacing:.02em}
header nav{display:flex;gap:8px;flex-wrap:wrap}
header nav a{padding:6px 10px;border-radius:8px;border:1px solid transparent}
header nav a.active{border-color:var(--line);background:var(--panel)}
header .spacer{flex:1}
.badge{font-size:11px;padding:2px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 12px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:#3a3f4b}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}
.grid{display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.muted{color:var(--muted)}
.kbd{font:12px ui-monospace,monospace;background:#1a1d23;border:1px solid var(--line);padding:2px 6px;border-radius:6px}
code{font:12px ui-monospace,monospace}
.topbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main{max-width:1280px;margin:0 auto;padding:18px 16px}
h1{font-size:22px;margin:8px 0}h2{font-size:16px;margin:14px 0 8px}h3{font-size:14px;margin:10px 0 6px}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
</style>
{% block head %}{% endblock %}
</head>
<body>
<header>
  <div class="brand">⬢ Sathancabrol</div>
  <span class="badge">monorepo • 8 projets</span>
  <nav>
    <a href="/" class="{% if request.url.path=='/' %}active{% endif %}">Vue d'ensemble</a>
    <a href="/repos" class="{% if request.url.path=='/repos' %}active{% endif %}">Panorama GitHub</a>
    <a href="/monorepo" class="{% if request.url.path=='/monorepo' %}active{% endif %}">Monorepo + Preview</a>
  </nav>
  <div class="spacer"></div>
  <a class="btn" href="https://github.com/Sathancabrol/monorepo" target="_blank" rel="noreferrer">GitHub ↗</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>
function fmt(n){return new Intl.NumberFormat('fr-FR').format(n)}
</script>
{% block scripts %}{% endblock %}
</body>
</html>

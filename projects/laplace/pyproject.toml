[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laplace-discord-agent"
version = "0.1.0"
description = "Discord-first, privacy-conscious LAPLACE assistant for Olympus and future app integrations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "LAPLACE contributors" }]
dependencies = [
  "aiosqlite>=0.20,<1",
  "discord.py>=2.4,<3",
  "openai>=1.50,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
laplace = "laplace.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["laplace*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

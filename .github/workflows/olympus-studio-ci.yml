name: OLYMPUS Studio — smoke tests
on:
  push:
    branches:
      - feat/olympus-studio-20261112
    paths:
      - 'projects/olympus-studio/**'
      - '.github/workflows/olympus-studio-ci.yml'
  pull_request:
    paths:
      - 'projects/olympus-studio/**'
      - '.github/workflows/olympus-studio-ci.yml'
  workflow_dispatch:

concurrency:
  group: olympus-studio-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/olympus-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static parse
        run: |
          node --check server.mjs
          node --check scripts/mobile-preview.mjs
          node --check scripts/shared-camera-relay.mjs
          node --check src/shared-camera.js
          node --check tests/shared-camera.test.mjs
          node --check src/app.js
          node --check src/media-store.js
          node --check tests/media-store.test.mjs
          node --check src/meeting-utils.js
          node --check tests/meeting-utils.test.mjs
          node --check src/v03-migration.js
          node --check tests/v03-migration.test.mjs
          node --check src/storyboard.js
          node --check src/edit-audio.js
          node --check tests/edit-audio.test.mjs
          node --check src/video-duration.js
          node --check tests/video-duration.test.mjs
          python -m py_compile tests/browser_media_smoke.py
          node --check tests/storyboard.test.mjs
          node --check src/obs-client.js
          node --check src/obs-panel.js
          node --check tests/obs-client.test.mjs
          node --check tests/smoke.test.mjs
      - name: API smoke tests
        run: npm test
      - name: Pack Windows preview (Node.js requis)
        run: |
          zip -q -r olympus-studio-preview.zip index.html server.mjs package.json LANCER_OLYMPUS.bat LANCER_MOBILE.bat src scripts docs tests README.md
          unzip -t olympus-studio-preview.zip | tail -1
      - name: Publier le paquet de test
        uses: actions/upload-artifact@v4
        with:
          name: olympus-studio-preview
          path: projects/olympus-studio/olympus-studio-preview.zip
          retention-days: 14
          if-no-files-found: error

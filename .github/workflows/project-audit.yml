name: Project portfolio audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches:
      - main
    paths:
      - "data/audit/portfolio.json"
      - "scripts/project_audit/**"
      - ".github/workflows/project-audit.yml"
      - "docs/AUDIT_AUTOMATION.md"
      - "docs/AUDIT_GAP_DRIVEN_PROTOCOL.md"

permissions:
  contents: write

concurrency:
  group: project-portfolio-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run read-only portfolio audit
        env:
          GH_AUDIT_TOKEN: ${{ secrets.GH_AUDIT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/project_audit/audit_portfolio.py

      - name: Run gap-driven branch discovery
        env:
          GH_AUDIT_TOKEN: ${{ secrets.GH_AUDIT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_MAX_BRANCH_TREES: "15"
        run: python scripts/project_audit/audit_gaps.py

      - name: Publish updated audit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/project-audit/latest.json reports/project-audit/latest.md reports/project-audit/index.html reports/project-audit/history.jsonl reports/project-audit/branch-index.json reports/project-audit/gaps.json reports/project-audit/gaps.md
          if git diff --cached --quiet; then
            echo "No report changes to publish."
          else
            git commit -m "chore(audit): refresh project audit gaps and KPIs"
            git push origin HEAD:main
          fi
